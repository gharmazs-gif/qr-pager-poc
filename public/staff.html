<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pager – Staff</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root { --bg:#f6f4f1; --card:#fff; --ink:#1d1d1f; --mute:#6b6b70; --brand:#e8452c; --ok:#1f9d55; --line:#e4e0da; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); background:var(--card); }
  h1 { font-size:18px; margin:0; }
  main { display:grid; grid-template-columns: 320px 1fr; gap:24px; padding:24px; max-width:1000px; margin:0 auto; }
  @media (max-width:760px){ main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; }
  button { font:inherit; border:0; border-radius:10px; padding:12px 18px; cursor:pointer; background:var(--brand); color:#fff; font-weight:600; }
  button.ghost { background:#eee; color:var(--ink); }
  button.ok { background:var(--ok); }
  #qr { display:flex; justify-content:center; margin:16px 0; }
  #qrInfo { text-align:center; color:var(--mute); font-size:13px; word-break:break-all; }
  .order { display:flex; align-items:center; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--line); }
  .order:last-child { border-bottom:0; }
  .num { font-size:22px; font-weight:700; }
  .badge { font-size:12px; padding:3px 9px; border-radius:99px; background:#eee; color:var(--mute); margin-left:10px; }
  .badge.ready { background:#d9f3e3; color:var(--ok); }
  .badge.collected { background:#eee; color:#999; }
  .empty { color:var(--mute); padding:20px 0; text-align:center; }
</style>
</head>
<body>
<header><h1>Pager · Staff dashboard</h1><span id="base" style="color:var(--mute);font-size:13px"></span></header>
<main>
  <section class="card">
    <button id="newBtn" style="width:100%">+ New order</button>
    <div id="qr"></div>
    <div id="qrInfo">Create an order, then let the customer scan the QR code.</div>
  </section>
  <section class="card">
    <h2 style="margin-top:0;font-size:16px">Orders</h2>
    <div id="list"></div>
  </section>
</main>
<script>
let baseUrl = location.origin;
const qrEl = document.getElementById('qr');
const info = document.getElementById('qrInfo');

async function api(path, method = 'GET') {
  const r = await fetch(path, { method });
  return r.json();
}

function showQr(order) {
  const url = `${baseUrl}/o/${order.token}`;
  qrEl.innerHTML = '';
  new QRCode(qrEl, { text: url, width: 220, height: 220 });
  info.innerHTML = `<b style="font-size:20px;color:#1d1d1f">Order #${order.number}</b><br>${url}`;
}

async function refresh() {
  const orders = await api('/api/orders');
  const list = document.getElementById('list');
  if (!orders.length) { list.innerHTML = '<div class="empty">No orders yet</div>'; return; }
  list.innerHTML = '';
  for (const o of orders) {
    const row = document.createElement('div');
    row.className = 'order';
    row.innerHTML = `<div><span class="num">#${o.number}</span><span class="badge ${o.status}">${o.status}</span></div>`;
    const actions = document.createElement('div');
    if (o.status === 'preparing') {
      const b = document.createElement('button'); b.textContent = 'Ready'; b.className = 'ok';
      b.onclick = async () => { await api(`/api/orders/${o.token}/ready`, 'POST'); refresh(); };
      actions.appendChild(b);
    } else if (o.status === 'ready') {
      const b = document.createElement('button'); b.textContent = 'Collected'; b.className = 'ghost';
      b.onclick = async () => { await api(`/api/orders/${o.token}/done`, 'POST'); refresh(); };
      actions.appendChild(b);
    }
    const qrBtn = document.createElement('button'); qrBtn.textContent = 'QR'; qrBtn.className = 'ghost'; qrBtn.style.marginLeft = '8px';
    qrBtn.onclick = () => showQr(o);
    actions.appendChild(qrBtn);
    row.appendChild(actions);
    list.appendChild(row);
  }
}

document.getElementById('newBtn').onclick = async () => {
  const o = await api('/api/orders', 'POST');
  showQr(o);
  refresh();
};

(async () => {
  const cfg = await api('/api/config');
  baseUrl = cfg.baseUrl;
  document.getElementById('base').textContent = baseUrl;
  refresh();
  setInterval(refresh, 4000);
})();
</script>
</body>
</html>
